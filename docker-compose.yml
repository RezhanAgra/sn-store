x-app: &app
  build:
    context: .
    target: app
  env_file: .env
  environment: &app-env
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-sn_store}
    DB_USERNAME: ${DB_USERNAME:-sn_store}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
  volumes:
    - app-storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}

  queue:
    <<: *app
    command: php artisan queue:work --tries=3 --timeout=90
    restart: unless-stopped
    depends_on:
      - app

  web:
    build:
      context: .
      target: web
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      - app

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sn_store}
      MYSQL_USER: ${DB_USERNAME:-sn_store}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
  app-storage:
